services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-changeme}
      - N8N_METRICS=false
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jbfind

  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: always
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jbfind

  scraper:
    build:
      context: ..
      dockerfile: deploy/scraper.Dockerfile
    container_name: jbfind-scraper
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - jbfind

  dashboard:
    build:
      context: ..
      dockerfile: deploy/dashboard.Dockerfile
    container_name: jbfind-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ~/.jbfind/secrets:/secrets:ro
      - ./dashboard.html:/dash/dashboard.html:ro
    networks:
      - jbfind

  healthcheck:
    image: curlimages/curl:latest
    container_name: n8n-healthcheck
    restart: always
    entrypoint: >
      /bin/sh -c "
      while true; do
        curl -fsS -m 10 https://hc-ping.com/ \${HEALTHCHECKS_UUID:-test} 2>/dev/null
        sleep 300
      done
      "
    networks:
      - jbfind

volumes:
  n8n_data:
  postgres_data:

networks:
  jbfind: